{% load wagtailcore_tags %}<nav aria-label="Primary">
	<a href="{% if root %}{% pageurl root %}{% else %}/{% endif %}" data-is="undone-text-logo" aria-label="Undone — home"></a>
	<p data-is="hk-time" aria-label="Hong Kong time">HKT</p>
	<div data-is="nav-actions">
		<button type="button" role="switch" aria-checked="true" data-is="menu-button" hidden>3D<svg viewBox="0 0 26 16" aria-hidden="true"><rect x="0.75" y="0.75" width="24.5" height="14.5" rx="7.25"/><circle cx="8" cy="8" r="5"/></svg></button>
		<button type="button" popovertarget="menu" data-is="menu-button">Menu</button>
	</div>
	<div popover id="menu" data-is="nav-menu">
		{% for block in page.body %}{% if block.block_type == "divider" and block.value.anchor %}<a href="#{{ block.value.anchor }}">{{ block.value.heading }}</a>
		{% endif %}{% endfor %}
		{% for item in root.get_children.live.in_menu %}<a href="{% pageurl item %}">{{ item.title }}</a>
		{% endfor %}
		<button type="button" popovertarget="menu" popovertargetaction="hide" data-is="menu-button">Close</button>
	</div>
</nav>
