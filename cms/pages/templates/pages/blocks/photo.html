{% load wagtailimages_tags %}{% image value.image width-1600 as img %}<figure data-is="photo">
	<img src="{{ img.url }}" width="{{ img.width }}" height="{{ img.height }}" alt="{% firstof value.alt img.alt %}" loading="lazy" decoding="async">
	{% if value.caption %}<p>{{ value.caption }}</p>{% endif %}
</figure>
