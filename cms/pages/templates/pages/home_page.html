{% extends "base.html" %}
{% load static %}

{% block title %}{% firstof page.seo_title 'Undone Limited | Creative R&amp;D · Hong Kong' %}{% endblock %}

{% block structured_data %}<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "Organization",
			"name": "Undone Limited",
			"url": "{{ page.full_url }}",
			"logo": "{{ request.scheme }}://{{ request.get_host }}{% static 'assets/img/undone-schema.png' %}",
			"description": "Creative R&D · Hong Kong",
			"email": "info@undoneltd.com",
			"address": {
				"@type": "PostalAddress",
				"addressLocality": "Hong Kong",
				"addressCountry": "HK"
			},
			"sameAs": [
				"https://www.undonelimited.com",
				"https://github.com/disuye"
			]
		}
		</script>{% endblock %}

{% block splash %}
	<div data-is="splash">
		<h1><i data-is="undone-text-logo" role="img" aria-label="Undone"></i></h1>
		<p>Creative R&D · Hong Kong · <i lang="zh-Hant-HK">香港</i></p>
		<a href="#content" data-is="scroll-cue" aria-label="Scroll to content">Scroll</a>
	</div>
{% endblock %}
